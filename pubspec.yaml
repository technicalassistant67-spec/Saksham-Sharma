name: safecross
description: "SafeCross — Navigate Smarter. Stay Aware. Real-time proximity safety alerting prototype."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_map_tile_caching: ^9.0.1
  geolocator: ^11.0.0
  web_socket_channel: ^2.4.1
  flutter_tts: ^3.8.5
  vibration: ^1.8.4
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
